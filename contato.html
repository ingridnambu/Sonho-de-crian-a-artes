            <article id="contact">
                
                <form id="confirmationForm">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" name="from_name" placeholder="Seu nome completo" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="reply_to" placeholder="Seu e-mail" required>
                    <label for="message">Como podemos ajudar?</label>
                    <textarea id="message" name="message" placeholder="Escreva sua dúvida ou ideia de personalização" rows="5" required></textarea>


                    <button type="submit">Enviar mensagem</button>
                    
                </form>

                <div id="confirmationMessage" role="status" aria-live="polite"></div>
            </article>
        </div>
    </section>
